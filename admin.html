<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil Admin</title>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0b0b0f; color:#fff;
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:380px; background:#131318; border:1px solid #23232b; border-radius:16px; padding:24px; }
  h1{ font-size:18px; margin:0 0 4px; }
  p.sub{ color:#9a9aa5; font-size:13px; margin:0 0 20px; }
  label{ display:block; font-size:12px; color:#9a9aa5; margin:14px 0 6px; }
  input, select{ width:100%; background:#1b1b22; border:1px solid #2a2a33; border-radius:10px; padding:12px 14px;
        color:#fff; font-size:15px; }
  button{ width:100%; margin-top:18px; background:#14F195; border:none; border-radius:10px; padding:13px;
        font-weight:700; font-size:15px; color:#04140c; cursor:pointer; }
  button:disabled{ opacity:0.5; }
  button.secondary{ background:#23232b; color:#fff; margin-top:8px; }
  .err{ color:#ff6b6b; font-size:13px; margin-top:10px; min-height:16px; }
  .code-out{ margin-top:18px; background:#1b1b22; border:1px dashed #3a3a45; border-radius:10px; padding:16px;
        text-align:center; font-size:20px; font-weight:700; letter-spacing:1px; display:none; }
  .code-out.show{ display:block; }
  .code-meta{ font-size:12px; color:#9a9aa5; margin-top:6px; }
  .list{ margin-top:22px; max-height:260px; overflow-y:auto; }
  .row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #20202a; font-size:13px; }
  .row .tag{ font-size:11px; padding:2px 7px; border-radius:6px; }
  .tag.used{ background:#2a1a1a; color:#ff8080; }
  .tag.live{ background:#12281f; color:#14F195; }
  .tag.expired{ background:#2a251a; color:#e0b84d; }
  #login-view, #tool-view{ display:none; }
</style>
</head>
<body>

<div class="card" id="login-view">
  <h1>Veil Admin</h1>
  <p class="sub">Sign in with the admin account to generate invite codes.</p>
  <label>Email</label>
  <input id="login-email" type="email" autocomplete="username">
  <label>Password</label>
  <input id="login-password" type="password" autocomplete="current-password">
  <button onclick="doLogin()" id="login-btn">Sign in</button>
  <div class="err" id="login-err"></div>
</div>

<div class="card" id="tool-view">
  <h1>Generate invite code</h1>
  <p class="sub">Signed in as <span id="who"></span> · <a href="#" onclick="doLogout();return false;" style="color:#9a9aa5;">sign out</a></p>

  <label>Validity window</label>
  <select id="duration-select">
    <option value="1w">1 week</option>
    <option value="1m">1 month</option>
    <option value="lifetime">Lifetime (never expires)</option>
  </select>

  <button onclick="generateCode()" id="gen-btn">Generate code</button>
  <div class="err" id="gen-err"></div>

  <div class="code-out" id="code-out">
    <div id="code-text">—</div>
    <div class="code-meta" id="code-meta"></div>
  </div>

  <div class="list" id="code-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-Hx86meaXo-lptSSuij5cnKi-DUXRSBs",
  authDomain: "veil-99263.firebaseapp.com",
  projectId: "veil-99263",
  storageBucket: "veil-99263.firebasestorage.app",
  messagingSenderId: "410710513338",
  appId: "1:410710513338:web:b2df379d940c68a92c1483"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function showLoggedIn(user){
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('tool-view').style.display = 'block';
  document.getElementById('who').textContent = user.email;
  refreshCodeList();
}
function showLoggedOut(){
  document.getElementById('login-view').style.display = 'block';
  document.getElementById('tool-view').style.display = 'none';
}

auth.onAuthStateChanged(user=>{
  if(user) showLoggedIn(user);
  else showLoggedOut();
});

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in...';
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    errEl.textContent = 'Sign-in failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Sign in';
}
function doLogout(){ auth.signOut(); }

function randomCode(){
  const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const seg = ()=> Array.from({length:4}, ()=> chars[Math.floor(Math.random()*chars.length)]).join('');
  return `VEIL-${seg()}-${seg()}`;
}

async function generateCode(){
  const duration = document.getElementById('duration-select').value;
  const btn = document.getElementById('gen-btn');
  const errEl = document.getElementById('gen-err');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Generating...';

  let expiresAt = null;
  const now = new Date();
  if(duration === '1w'){ const d = new Date(now); d.setDate(d.getDate()+7); expiresAt = firebase.firestore.Timestamp.fromDate(d); }
  if(duration === '1m'){ const d = new Date(now); d.setMonth(d.getMonth()+1); expiresAt = firebase.firestore.Timestamp.fromDate(d); }

  const code = randomCode();
  try{
    await db.collection('inviteCodes').doc(code).set({
      duration, expiresAt, used:false, redeemedBy:null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: auth.currentUser.uid
    });
    document.getElementById('code-text').textContent = code;
    document.getElementById('code-meta').textContent =
      duration === 'lifetime' ? 'Never expires' : `Expires ${expiresAt.toDate().toLocaleString()}`;
    document.getElementById('code-out').classList.add('show');
    refreshCodeList();
  }catch(e){
    errEl.textContent = 'Failed: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Generate code';
}

async function refreshCodeList(){
  const listEl = document.getElementById('code-list');
  listEl.innerHTML = '<div style="color:#666;font-size:13px;">Loading...</div>';
  try{
    const snap = await db.collection('inviteCodes').orderBy('createdAt','desc').limit(25).get();
    if(snap.empty){ listEl.innerHTML = '<div style="color:#666;font-size:13px;">No codes yet.</div>'; return; }
    const now = Date.now();
    listEl.innerHTML = '';
    snap.forEach(doc=>{
      const d = doc.data();
      const expired = d.expiresAt && d.expiresAt.toMillis() < now;
      let tagClass = 'live', tagText = 'active';
      if(d.used){ tagClass='used'; tagText='used'; }
      else if(expired){ tagClass='expired'; tagText='expired'; }
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>${doc.id}</span><span class="tag ${tagClass}">${tagText}</span>`;
      listEl.appendChild(row);
    });
  }catch(e){
    listEl.innerHTML = '<div style="color:#ff6b6b;font-size:13px;">Failed to load: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
